services:
  - type: web
    runtime: static
    name: siteradar
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://icqkurgimumojmtnzxya.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
